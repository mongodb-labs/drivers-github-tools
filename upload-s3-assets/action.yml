name: Upload S3 assets
description: Uploads assets from the S3 asset directory
inputs:
  version:
    description: "The published version"
    required: true
  product_name:
    description: "The name of the product"
    required: true
  filenames:
    description: "Files to upload - supports wildcards and glob patterns"
    default: '*'
    required: false
  dry_run:
    description: "Only print files that would be uploaded, but don't upload any files"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Upload the assets to S3
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PRODUCT_NAME: ${{ inputs.product_name }}
        FILENAMES: ${{ inputs.filenames }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: bash "${{ github.action_path }}/upload-s3-assets.sh"
