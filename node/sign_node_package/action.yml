name: Compress, Sign and Upload to GH Release
description: "Compresses package and signs with garasign and uploads to GH release"

inputs:
  aws_role_arn:
    description: "AWS role input for drivers-github-tools/gpg-sign@v3"
    required: true
  aws_region_name:
    description: "AWS region name input for drivers-github-tools/gpg-sign@v3"
    required: true
  aws_secret_id:
    description: "AWS secret id input for drivers-github-tools/gpg-sign@v3"
    required: true
  npm_package_name:
    description: "The name for the npm package this repository represents"
    required: true
  dry_run:
    description: "Should we upload files to the release?"
    required: false
    default: "false"
  artifact_directory:
    description: The directory in which to output signatures.
    default: artifacts
  sign_native:
    description: Download and sign native packages
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      if: ${{ inputs.sign_native == 'true' }}
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    - run: npm pack
      shell: bash

    - name: Make signatures directory
      shell: bash
      run: |
        mkdir ${{ inputs.artifact_directory }}

    - name: Load version and package info
      shell: bash
      run: bash "${{ github.action_path }}/../get_version_info/get_version_info.sh"

    - name: Set up drivers-github-tools - configure aws credentials for ECR
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::901841024863:role/ecr-role-gha-ro
        role-session-name: release-session
        aws-region: us-east-1
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    - name: Set up drivers-github-tools - log in to ECR
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      with:
        registries: "901841024863"
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    - name: Set up drivers-github-tools - configure aws credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        role-session-name: release-session
        aws-region: ${{ inputs.aws_region_name }}
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    - name: Set up drivers-github-tools - read secrets from AWS Secrets Manager into environment variables
      uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
      with:
        secret-ids: |
          ${{ inputs.aws_secret_id }}
        parse-json-secrets: true
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    - name: Set up drivers-github-tools - set up
      shell: bash
      run: bash "${{ github.action_path }}/../../setup/setup.sh"
      env:
        AWS_SECRET_ID: ${{ inputs.aws_secret_id }}

    - name: Determine what files to sign (native packages, works with glob patterns of build artifacts)
      if: ${{ inputs.sign_native == 'true' }}
      shell: bash
      run: |
        # all prebuilds
        FILENAMES=$(find build-* -type f -name '*.tar.gz' | tr '\n' ' ')
        FILENAMES="$FILENAMES ${{ env.package_file }}"
        echo "FILES_TO_SIGN=${FILENAMES}" >> "$GITHUB_ENV"

    - name: Determine what files to sign (non-native packages, with only the release tarball)
      if: ${{ inputs.sign_native != 'true' }}
      shell: bash
      run: |
        FILENAMES="${{ env.package_file }}"
        echo "FILES_TO_SIGN=${FILENAMES}" >> "$GITHUB_ENV"

    - name: Create detached signature
      shell: bash
      env:
        FILENAMES: ${{ env.FILES_TO_SIGN }}
        RELEASE_ASSETS: ${{ inputs.artifact_directory }}
      run: bash "${{ github.action_path }}/../../gpg-sign/gpg-sign.sh"

    - name: Copy the tarballs to the artifacts directory
      shell: bash
      run: |
        for filename in ${{ env.FILES_TO_SIGN }}; do cp ${filename} artifacts/; done
        ls -la artifacts/

    - name: "Upload release artifacts"
      if: ${{ inputs.dry_run == 'false' }}
      run: gh release upload v${{ env.package_version }} artifacts/*.*
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
