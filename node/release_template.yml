# This is a template rendered into Node.js driver repos by generate_release.mjs, so it must keep pinned owner/repo/path@vX references (not $/), since $/ resolves relative to whatever repo the rendered workflow ends up living in, not this repo.
on:
  push:
    branches: [RELEASE_BRANCH]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-RELEASE_TAG

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: RELEASE_BRANCH

  build:
    needs: [release_please]
    name: "Perform any build or bundling steps, as necessary."
    uses: ./.github/workflows/build.yml

  ssdlc:
    needs: [release_please, build]
    permissions:
      # required for all workflows
      security-events: write
      id-token: write
      contents: write
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node and dependencies
        uses: mongodb-labs/drivers-github-tools/node/setup@v3
        with:
          ignore_install_scripts: IGNORE_INSTALL_SCRIPTS

      - name: Load version and package info
        uses: mongodb-labs/drivers-github-tools/node/get_version_info@v3
        with:
          npm_package_name: RELEASE_PACKAGE

      - name: actions/compress_sign_and_upload
        uses: mongodb-labs/drivers-github-tools/node/sign_node_package@v3
        with:
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          aws_region_name: us-east-1
          aws_secret_id: ${{ secrets.AWS_SECRET_ID }}
          npm_package_name: RELEASE_PACKAGE
          dry_run: ${{ needs.release_please.outputs.release_created == '' }}

      - name: Copy sbom file to release assets
        shell: bash
        if: ${{ SBOM_IN_PATH == '' }}
        run: cp sbom.json ${{ env.S3_ASSETS }}/sbom.json

      # only used for mongodb-client-encryption
      - name: Augment SBOM and copy to release assets
        if: ${{ SBOM_IN_PATH != '' }}
        uses: mongodb-labs/drivers-github-tools/sbom@v3
        with:
          sbom_in_path: SBOM_IN_PATH
          kondukto_sub_project: KONDUKTO_SUB_PROJECT
          sbom_file_name: sbom.json

      - name: Generate authorized pub report
        uses: mongodb-labs/drivers-github-tools/full-report@v3
        with:
          release_version: ${{ env.package_version }}
          product_name: RELEASE_PACKAGE
          sarif_report_target_ref: RELEASE_BRANCH
          third_party_dependency_tool: n/a
          dist_filenames: artifacts/*
          token: ${{ github.token }}
          sbom_file_name: sbom.json
          evergreen_project: EVERGREEN_PROJECT
          evergreen_commit: ${{ env.commit }}

      - uses: mongodb-labs/drivers-github-tools/upload-s3-assets@v3
        with:
          version: ${{ env.package_version }}
          product_name: RELEASE_PACKAGE
          dry_run: ${{ needs.release_please.outputs.release_created == '' }}

  publish:
    needs: [release_please, ssdlc, build]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node and dependencies
        uses: mongodb-labs/drivers-github-tools/node/setup@v3

      - run: npm publish --provenance --tag=RELEASE_TAG
        if: ${{ needs.release_please.outputs.release_created }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
