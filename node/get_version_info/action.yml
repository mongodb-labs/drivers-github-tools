name: Publish Release Asset to S3
description: "Publish Asset to S3"
inputs:
  npm_package_name:
    description: the npm package name
    required: true

runs:
  using: composite
  steps:
    - name: Get release version and release package file name
      id: get_version
      shell: bash
      run: bash "${{ github.action_path }}/get_version_info.sh"
