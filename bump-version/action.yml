name: Bump Version
description: Bump the version and push if not a dry-run
inputs:
  version:
    description: The new version
    required: true
  version_bump_script:
    description: The version bump script
    default: ''
  commit_template:
    description: The template for the git commit message
    default: "BUMP ${VERSION}"
  push_commit:
    description: Whether to push the commit
    default: "true"
  working_directory:
    description: The working directory for the version bump
    default: "."
  ecr_repository:
    description: "The ECR repository to use"
    default: release-infrastructure/garasign-git

runs:
  using: composite
  steps:
    - name: Bump the version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERSION_BUMP_SCRIPT: ${{ inputs.version_bump_script }}
        COMMIT_TEMPLATE: ${{ inputs.commit_template }}
        PUSH_COMMIT: ${{ inputs.push_commit }}
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        ECR_REPOSITORY: ${{ inputs.ecr_repository }}
      run: bash "${{ github.action_path }}/bump-version.sh"
