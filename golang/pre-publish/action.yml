name: Pre Publish
description: Pre Publish Action for Go Driver
inputs:
  version:
    description: The published version
    required: true
  push_changes:
    description: Whether to push the changes
    default: "true"
  ignored_branches:
    description: Branches to ignore when merging up changes
    required: true
  dry_run:
    description: Whether this is a dry run
    required: true

runs:
  using: composite
  steps:
    - name: Bump the version
      shell: bash
            # Never push commit, we still need to merge up if a push is requested
      env:
        VERSION: ${{ inputs.version }}
        VERSION_BUMP_SCRIPT: "go run ${{ github.action_path }}/bump-version.go"
        COMMIT_TEMPLATE: "BUMP v${VERSION}"
        PUSH_COMMIT: "false"
        WORKING_DIRECTORY: "."
        ECR_REPOSITORY: ""
      run: bash "${{ github.action_path }}/../../bump-version/bump-version.sh"
    - name: Tag the version
      shell: bash
      env:
        VERSION: v${{ inputs.version }}
        PUSH_TAG: ${{ inputs.push_changes }}
      run: bash "${{ github.action_path }}/../../tag-version/tag-version.sh"
    - name: "Determine branch to merge up to"
      if: ${{ inputs.push_changes == 'true' && ! contains(fromJSON(inputs.ignored_branches), github.ref_name) }}
      id: get-next-branch
      uses: alcaeus/automatic-merge-up-action/get-next-branch@874dd723d79cb95bb2360bfeb46b6964060aa515 #1.1.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      with:
        ref: ${{ github.ref_name }}
        branchNamePattern: 'release/<major>.<minor>'
        devBranchNamePattern: 'v<major>'
        fallbackBranch: 'master'
        ignoredBranches: ${{ inputs.ignored_branches }}
    - name: "Manually merge up changes"
      if: ${{ inputs.dry_run == 'false' && inputs.push_changes == 'true' && ! contains(fromJSON(inputs.ignored_branches), github.ref_name) && steps.get-next-branch.outputs.hasNextBranch }}
      shell: bash
      run: |
        git checkout ${NEXT_BRANCH}
        git merge --strategy=ours ${RELEASE_BRANCH}
        git push origin ${NEXT_BRANCH}
        git checkout ${RELEASE_BRANCH}
        git push origin ${RELEASE_BRANCH}
      env:
        NEXT_BRANCH: ${{ steps.get-next-branch.outputs.branchName }}
        RELEASE_BRANCH: ${{ github.ref_name }}
