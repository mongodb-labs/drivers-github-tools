name: Publish
description: Publish Go Driver Release
inputs:
  version:
    description: The published version
    required: true
  prev_version:
    description: The previous version
    required: true
  evergreen_project:
    description: The evergreen project name.
    required: true
  push_changes:
    description: Whether to push the changes
    default: "true"
  token:
    description: The GitHub token

runs:
  using: composite
  steps:
    - name: Get the evergreen commit
      id: evergreen-commit
      shell: bash
      run: |
        echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
    - name: Generate the reports
      shell: bash
      env:
        PRODUCT_NAME: mongo-go-driver
        RELEASE_VERSION: ${{ inputs.version }}
        SBOM_IN_PATH: sbom.json
        EVERGREEN_PROJECT: ${{ inputs.evergreen_project }}
        EVERGREEN_COMMIT: ${{ steps.evergreen-commit.outputs.commit }}
        SECURITY_REPORT_LOCATION: ${{ env.SECURITY_REPORT_URL }}
        TOKEN: ${{ inputs.token }}
        CODE_SCANNING_TOKEN: ${{ github.token }}
      run: bash "${{ github.action_path }}/../../full-report/full-report.sh"
    - name: Publish GitHub Release
      shell: bash -eux {0}
      working-directory: ${{ github.action_path }}
      env:
        VERSION: ${{ inputs.version }}
        PREV_VERSION: ${{ inputs.prev_version }}
        PUSH_CHANGES: ${{ inputs.push_changes }}
        GH_TOKEN: ${{ inputs.token }}
      run: ./publish.sh
    - name: Upload S3 assets
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PRODUCT_NAME: mongo-go-driver
        DRY_RUN: ${{ env.DRY_RUN }}
      run: bash "${{ github.action_path }}/../../upload-s3-assets/upload-s3-assets.sh"