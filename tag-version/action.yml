name: Bump Version
description: Bump the version and push if not a dry-run
inputs:
  version:
    description: The new version
    required: true
  tag_template:
    description: The template for the git tag
    default: "${VERSION}"
  tag_message_template:
    description: The template for the git tag message
    default: "Release ${VERSION}"
  push_tag:
    description: Whether to push the tag
    default: "true"
  ecr_repository:
    description: "The ECR repository to use"
    default: release-infrastructure/garasign-git

runs:
  using: composite
  steps:
    - name: Tag the version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TAG_TEMPLATE: ${{ inputs.tag_template }}
        TAG_MESSAGE_TEMPLATE: ${{ inputs.tag_message_template }}
        PUSH_TAG: ${{ inputs.push_tag }}
        ECR_REPOSITORY: ${{ inputs.ecr_repository }}
      run: bash "${{ github.action_path }}/tag-version.sh"
