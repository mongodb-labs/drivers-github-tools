name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-gpg-key-commit-message:
    name: Test GPG-Key commit message format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - gpg_public_url: "https://pgp.mongodb.com/python-driver.pub"
            expect_gpg_key: "true"
          - gpg_public_url: ""
            expect_gpg_key: "false"
    env:
      GPG_PUBLIC_URL: ${{ matrix.gpg_public_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
      - name: Make a commit using the same message flags as bump-version
        run: |
          echo "test" >> test_file.txt
          git add test_file.txt
          git commit -m "BUMP 1.0.0" \
            ${{ env.GPG_PUBLIC_URL != '' && format('-m "GPG-Key: {0}"', env.GPG_PUBLIC_URL) || '' }} \
            -s
      - name: Verify commit message format
        run: |
          MSG=$(git log -1 --format=%B)
          echo "$MSG"
          if [ "${{ matrix.expect_gpg_key }}" = "true" ]; then
            echo "$MSG" | grep -q "GPG-Key: $GPG_PUBLIC_URL"
          else
            ! echo "$MSG" | grep -q "GPG-Key:"
          fi

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        working-directory:
          - code-scanning-export

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.working-directory }}/.node-version
          cache: npm
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Install Dependencies
        id: npm-ci
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Check Format
        id: npm-format-check
        working-directory: ${{ matrix.working-directory }}
        run: npm run format:check

      - name: Lint
        id: npm-lint
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint

      - name: Test
        id: npm-ci-test
        working-directory: ${{ matrix.working-directory }}
        run: npm run ci-test
