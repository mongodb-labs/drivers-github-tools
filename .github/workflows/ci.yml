name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        working-directory:
          - code-scanning-export

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ matrix.working-directory }}/.node-version
          cache: npm
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json

      - name: Install Dependencies
        id: npm-ci
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Check Format
        id: npm-format-check
        working-directory: ${{ matrix.working-directory }}
        run: npm run format:check

      - name: Lint
        id: npm-lint
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint

      - name: Test
        id: npm-ci-test
        working-directory: ${{ matrix.working-directory }}
        run: npm run ci-test

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run uv lock update tests
        run: |
          bash python/uv-lock-update/test_diff_lock.sh
          bash python/uv-lock-update/test_decide_pr_action.sh
          bash python/uv-lock-update/test_update_lock.sh
