name: Python Setup
description: Installs Python, uv, and just, and optionally runs project just recipes
inputs:
  python-version:
    description: Python version setup-python installs and uv then uses
    default: "3.10"
  allow-prereleases:
    description: Select a prerelease when python-version has no stable release, instead of failing
    default: "true"
  enable-cache:
    description: Cache the uv download cache between runs
    default: "true"
  just-recipes:
    description: Comma-separated just recipes to run after setup, each of which must exist
    default: ""

runs:
  using: composite
  steps:
    # Runner images already ship these versions, so uv downloads no interpreter.
    - name: Install Python
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: ${{ inputs.allow-prereleases }}

    - name: Point uv at that interpreter
      shell: bash
      env:
        PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      # GITHUB_ENV is the only way a composite action exports to later steps.
      run: | # zizmor: ignore[github-env]
        # An absolute path pins uv here, ignoring .python-version.
        echo "UV_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: ${{ inputs.enable-cache }}

    - name: Install just
      shell: bash
      run: uv tool install rust-just

    - name: Run just recipes
      if: inputs.just-recipes != ''
      shell: bash
      env:
        JUST_RECIPES: ${{ inputs.just-recipes }}
      run: |
        IFS=',' read -ra recipes <<< "$JUST_RECIPES"
        for recipe in "${recipes[@]}"; do
          # Skip a blank entry, so a trailing comma does not run the default
          # recipe. Unquoted, so an entry can carry arguments.
          [ -n "${recipe// /}" ] || continue
          # shellcheck disable=SC2086
          just $recipe
        done
