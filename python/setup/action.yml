name: Python Setup
description: Installs Python, uv, and just, and optionally runs the project's `just install` recipe
inputs:
  python-version:
    description: Python version for setup-python to install, and the interpreter uv will use
    default: "3.10"
  allow-prereleases:
    description: >-
      Let setup-python fall back to a prerelease when python-version has no
      stable release yet, so asking for a Python still in beta gets that beta
      instead of failing. On by default, because uv resolves such a version on
      its own and a consumer moving to this action should not lose that.
    default: "true"
  enable-cache:
    description: Cache the uv download cache between runs
    default: "true"
  exclude-newer:
    description: >-
      UV_EXCLUDE_NEWER value, which holds back packages published after it: a
      date (2026-01-01), an RFC 3339 timestamp, or a duration ('7 days', 'P7D').
      Empty by default, which leaves resolution to the consuming repo's own
      configuration — a committed uv.lock, or exclude-newer in its pyproject.toml.
    default: ""
  run-install:
    description: >-
      Run the project's `just install` recipe. Set to 'false' for jobs that do
      not need project dependencies. When 'true' but the project has no justfile
      or no `install` recipe, the step is skipped rather than failing.
    default: "true"

runs:
  using: composite
  steps:
    # The runner images already ship several Python versions, so installing from
    # them is faster than having uv download a managed interpreter. uv is pointed
    # at this one below rather than choosing its own.
    - name: Install Python
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: ${{ inputs.allow-prereleases }}

    - name: Configure uv
      shell: bash
      env:
        # Inputs go through env rather than into the script body, so a value
        # containing shell metacharacters cannot alter the commands below.
        PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        EXCLUDE_NEWER: ${{ inputs.exclude-newer }}
      # Exporting to the caller's later steps is the point of this step, and
      # GITHUB_ENV is the only way a composite action can do it, so the
      # github-env audit has nothing actionable to say here. The values come
      # from setup-python and this action's own inputs, not from a caller's
      # untrusted content.
      run: | # zizmor: ignore[github-env]
        # An absolute interpreter path makes the choice exact: uv uses this
        # interpreter and never falls back to downloading one, whatever the
        # consuming project's pyproject.toml or .python-version asks for.
        echo "UV_PYTHON=$PYTHON_PATH" >> "$GITHUB_ENV"
        if [ -n "$EXCLUDE_NEWER" ]; then
          echo "UV_EXCLUDE_NEWER=$EXCLUDE_NEWER" >> "$GITHUB_ENV"
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: ${{ inputs.enable-cache }}

    - name: Install just
      shell: bash
      run: uv tool install rust-just

    - name: Run just install
      if: inputs.run-install == 'true'
      shell: bash
      run: ${{ github.action_path }}/run_install.sh
