name: uv Lock Update
description: >-
  Runs `uv lock --upgrade` and opens or refreshes a single pull request with
  the lock file changes. Optionally keeps [tool.uv] required-version aligned
  with the uv version Dependabot's updater image ships.
inputs:
  app_id:
    description: GitHub App ID for authenticated pushes. Required unless dry_run is true.
    default: ""
  private_key:
    description: GitHub App private key for authenticated pushes. Required unless dry_run is true.
    default: ""
  branch:
    description: Branch name for the update pull request
    default: uv-lock-update
  base:
    description: >-
      Base branch for the update pull request. Defaults to the ref the workflow
      ran on, which is what actions/checkout checks out when given no ref.
    default: ""
  labels:
    description: Labels to apply to the pull request
    default: dependencies
  track_dependabot_uv:
    description: >-
      Keep [tool.uv] required-version compatible with the uv version
      Dependabot's latest updater image ships, and regenerate the lock file
      with that same uv. No pin, no effect.
    default: "false"
  dry_run:
    description: If 'true', report intended actions without pushing or modifying pull requests
    default: "false"

runs:
  using: composite
  steps:
    # A dry run only reads, so it needs no app token and works before an App
    # is configured. Real runs push, so the next step fails fast without one.
    - name: Generate app token
      id: app-token
      if: inputs.dry_run != 'true' && inputs.app_id != '' && inputs.private_key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Require an app token outside dry runs
      if: inputs.dry_run != 'true' && (inputs.app_id == '' || inputs.private_key == '')
      shell: bash
      run: |
        echo "::error::app_id and private_key are both required unless dry_run is true. Falling back to github.token is not supported here: pull requests opened with it do not trigger workflow runs, so the pull request would arrive with no CI and look ready to merge."
        exit 1

    - name: Save current lock file
      shell: bash
      env:
        OLD_LOCK: ${{ runner.temp }}/uv.lock.before
      run: |
        if [ ! -f uv.lock ]; then
          echo "::error::No uv.lock found in ${PWD}. Run 'uv lock' and commit the result before using this action."
          exit 1
        fi
        cp uv.lock "$OLD_LOCK"

    # Gated on the tracking input; every tracking failure degrades to a
    # warning and a plain lock update, so the weekly pull request keeps shipping.
    - name: Resolve Dependabot's uv version
      id: dependabot-uv
      if: inputs.track_dependabot_uv == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.dry_run == 'true' && github.token || steps.app-token.outputs.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if version=$("$ACTION_PATH/dependabot_uv.sh"); then
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Dependabot's updater image ships uv $version"
        else
          echo "::warning::Could not determine the uv version in Dependabot's updater image; skipping required-version alignment. The lock update continues with the uv on PATH."
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    # Installing before the align step keeps a failed download from
    # stranding a rewritten pin the uv on PATH could no longer lock with.
    - name: Install Dependabot's uv
      id: install-uv
      if: inputs.track_dependabot_uv == 'true' && steps.dependabot-uv.outputs.available == 'true'
      shell: bash
      env:
        DEPENDABOT_UV: ${{ steps.dependabot-uv.outputs.version }}
      run: ${{ github.action_path }}/install_uv.sh

    - name: Align required-version with Dependabot's uv
      id: align-pin
      if: inputs.track_dependabot_uv == 'true' && steps.install-uv.outputs.uv_bin != ''
      shell: bash
      env:
        DEPENDABOT_UV: ${{ steps.dependabot-uv.outputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # --no-config: the workspace pin may reject the uv on PATH in exactly
        # the run that rewrites it. Exit 0 is every handled case; 2 fails.
        uv run --no-project --no-config --python '>=3.11' --with packaging \
          python "$ACTION_PATH/align_uv_pin.py" pyproject.toml "$DEPENDABOT_UV"

    - name: Upgrade the lock file
      shell: bash
      env:
        # Dependabot's uv only runs this workspace when the pin accepts it;
        # anything else falls back to the uv on PATH.
        UV_BIN: ${{ steps.align-pin.outputs.compatible == 'true' && steps.install-uv.outputs.uv_bin || '' }}
      run: |
        if [ -n "$UV_BIN" ]; then
          "$UV_BIN" lock --upgrade
        else
          uv lock --upgrade
        fi

    - name: Commit and summarize the upgrade
      id: prepare
      shell: bash
      env:
        # Only a dry run may use github.token. A live run gets the app token
        # or nothing, so no future edit can reintroduce a fallback that opens
        # pull requests CI never runs on.
        GH_TOKEN: ${{ inputs.dry_run == 'true' && github.token || steps.app-token.outputs.token }}
        BRANCH: ${{ inputs.branch }}
        DRY_RUN: ${{ inputs.dry_run }}
        OLD_LOCK: ${{ runner.temp }}/uv.lock.before
        ACTION_PATH: ${{ github.action_path }}
        ALIGNED: ${{ steps.align-pin.outputs.aligned }}
        OLD_PIN: ${{ steps.align-pin.outputs.old_pin }}
        NEW_PIN: ${{ steps.align-pin.outputs.new_pin }}
        DEPENDABOT_UV: ${{ steps.dependabot-uv.outputs.version }}
        UV_BIN: ${{ steps.align-pin.outputs.compatible == 'true' && steps.install-uv.outputs.uv_bin || '' }}
      run: ${{ github.action_path }}/update_lock.sh

    # Skipped when nothing changed, so a quiet run never touches an existing
    # pull request.
    - name: Create or update the pull request
      if: steps.prepare.outputs.changed == 'true'
      uses: $/open-or-update-pr
      with:
        token: ${{ inputs.dry_run == 'true' && github.token || steps.app-token.outputs.token }}
        branch: ${{ inputs.branch }}
        base: ${{ inputs.base || github.ref_name }}
        title: "Automation: Update uv.lock"
        body: ${{ steps.prepare.outputs.body }}
        labels: ${{ inputs.labels }}
        dry_run: ${{ inputs.dry_run }}
